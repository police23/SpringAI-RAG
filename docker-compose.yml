services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-rag-db
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API (used by Spring AI)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  rag-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-mcp-server
    ports:
      - "8080:8080" # Web UI & MCP SSE Endpoint (http://localhost:8080/sse)
    environment:
      - SPRING_AI_VECTORSTORE_QDRANT_HOST=qdrant
      - SPRING_AI_VECTORSTORE_QDRANT_PORT=6334
      - SPRING_AI_EMBEDDING_TRANSFORMER_CACHE_DIRECTORY=/root/.spring-ai/models
    volumes:
      - models_cache:/root/.spring-ai/models
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
  models_cache:
    driver: local